kind = "web"
previewPath = "/admin/"
title = "MysaAI — Sales War Machine"
version = "1.0.0"
id = "artifacts/sales-war-machine"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/admin/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/sales-war-machine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sales-war-machine", "run", "build" ]
publicDir = "artifacts/sales-war-machine/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/admin/"
