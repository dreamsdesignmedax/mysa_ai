components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ─── DASHBOARD ───
    DashboardSummary:
      type: object
      properties:
        totalLeads:
          type: integer
        totalLeadsThisMonth:
          type: integer
        qualifiedLeads:
          type: integer
        meetingsThisWeek:
          type: integer
        proposalsSent:
          type: integer
        pipelineValue:
          type: number
        dealsClosedThisMonth:
          type: integer
        bantQueueSize:
          type: integer
        outreachPending:
          type: integer
      required:
        - totalLeads
        - totalLeadsThisMonth
        - qualifiedLeads
        - meetingsThisWeek
        - proposalsSent
        - pipelineValue
        - dealsClosedThisMonth
        - bantQueueSize
        - outreachPending

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        leadName:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, type, description, createdAt]

    PipelineFunnel:
      type: object
      properties:
        stages:
          type: array
          items:
            $ref: "#/components/schemas/FunnelStage"
      required: [stages]

    FunnelStage:
      type: object
      properties:
        stage:
          type: string
        count:
          type: integer
        conversionRate:
          type: ["number", "null"]
      required: [stage, count]

    # ─── ICP ───
    Icp:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        markets:
          type: array
          items:
            type: string
        industries:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        companySize:
          type: string
        filters:
          type: object
        active:
          type: boolean
        leadCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, markets, industries, roles, companySize, filters, active, leadCount, createdAt]

    GenerateIcpBody:
      type: object
      properties:
        website:
          type: string
        description:
          type: string
      required: [description]

    IcpSuggestion:
      type: object
      properties:
        name:
          type: string
        markets:
          type: array
          items:
            type: string
        industries:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        companySize:
          type: string
        filters:
          type: object
      required: [name, markets, industries, roles, companySize, filters]

    CreateIcpBody:
      type: object
      properties:
        name:
          type: string
        markets:
          type: array
          items:
            type: string
        industries:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        companySize:
          type: string
        filters:
          type: object
        active:
          type: boolean
      required: [name, markets, industries, roles, companySize, filters]

    UpdateIcpBody:
      type: object
      properties:
        name:
          type: string
        markets:
          type: array
          items:
            type: string
        industries:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
        companySize:
          type: string
        filters:
          type: object
        active:
          type: boolean

    # ─── LEADS ───
    Lead:
      type: object
      properties:
        id:
          type: integer
        icpId:
          type: ["integer", "null"]
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        whatsapp:
          type: ["string", "null"]
        linkedInUrl:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        companyLogo:
          type: ["string", "null"]
        company:
          type: string
        city:
          type: ["string", "null"]
        country:
          type: string
        designation:
          type: string
        website:
          type: ["string", "null"]
        industry:
          type: string
        companySize:
          type: ["string", "null"]
        annualRevenue:
          type: ["string", "null"]
        source:
          type: string
        keywords:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        notes:
          type: ["string", "null"]
        bantScore:
          type: ["integer", "null"]
        bantBreakdown:
          type: ["object", "null"]
        bantBand:
          type: ["string", "null"]
          enum: ["hot", "qualified", "nurture", "disqualify", null]
