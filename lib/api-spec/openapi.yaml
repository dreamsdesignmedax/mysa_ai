      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        direction:
          type: string
          enum: [inbound, outbound]
        content:
          type: string
        waMessageId:
          type: ["string", "null"]
        sentAt:
          type: string
          format: date-time
      required: [id, conversationId, direction, content, sentAt]

    WhatsAppThread:
      type: object
      properties:
        conversation:
          $ref: "#/components/schemas/WhatsAppConversation"
        lead:
          oneOf:
            - $ref: "#/components/schemas/WhatsAppLeadEmbed"
            - type: "null"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppMessage"
      required: [conversation, messages]

    WhatsAppAnalytics:
      type: object
      properties:
        totalInitiated:
          type: integer
        yesRate:
          type: number
        reportsSent:
          type: integer
        appointmentsBooked:
          type: integer
        optedOut:
          type: integer
      required: [totalInitiated, yesRate, reportsSent, appointmentsBooked, optedOut]

    WhatsAppSettings:
      type: object
      properties:
        phoneNumberId:
          type: ["string", "null"]
        webhookVerifyToken:
          type: ["string", "null"]
        bookingUrl:
          type: ["string", "null"]
        consultantName:
          type: ["string", "null"]
        portfolioUrl:
          type: ["string", "null"]
        caseStudyUrl:
          type: ["string", "null"]
        companyProfileUrl:
          type: ["string", "null"]
        referenceSites:
          type: array
          items:
            type: string
        hookTemplateName:
          type: ["string", "null"]
        hookTemplateLang:
          type: ["string", "null"]
      required: []

    WhatsAppSettingsInput:
      type: object
      properties:
        accessToken:
          type: string
        appSecret:
          type: string
        phoneNumberId:
          type: string
        webhookVerifyToken:
          type: string
        bookingUrl:
          type: ["string", "null"]
        consultantName:
          type: ["string", "null"]
        portfolioUrl:
          type: ["string", "null"]
        caseStudyUrl:
          type: ["string", "null"]
        companyProfileUrl:
          type: ["string", "null"]
        referenceSites:
          type: array
          items:
            type: string
        hookTemplateName:
          type: ["string", "null"]
        hookTemplateLang:
          type: string
      required: []

    WhatsAppConnectionTest:
      type: object
      properties:
        ok:
          type: boolean
        detail:
          type: string
      required: [ok, detail]

    WhatsAppInitiateResult:
      type: object
      properties:
        success:
          type: boolean
        conversationId:
          type: integer
        message:
          type: string
        error:
          type: ["string", "null"]
      required: [success, message]

    WhatsAppBulkResult:
      type: object
      properties:
        succeeded:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              leadId:
                type: integer
              success:
                type: boolean
              message:
                type: string
            required: [leadId, success, message]
      required: [succeeded, failed, results]
