openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Dreamsdesign Sales War Machine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard and analytics
  - name: icp
    description: Ideal Customer Profile management
  - name: leads
    description: Lead management
  - name: audit
    description: Brand audit engine
  - name: qualify
    description: BANT qualification
  - name: outreach
    description: Outreach sequences and messages
  - name: meetings
    description: Meeting management
  - name: proposals
    description: Proposal and close tracking
  - name: anthropic
    description: Anthropic AI chat operations
  - name: settings
    description: Application settings
  - name: whatsapp
    description: WhatsApp bot conversations and settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─────────────────────────────────────────
  # DASHBOARD
  # ─────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get KPI summary for dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/pipeline-funnel:
    get:
      operationId: getPipelineFunnel
      tags: [dashboard]
      summary: Get pipeline funnel stage counts
      responses:
        "200":
          description: Funnel stage counts with conversion rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineFunnel"

  # ─────────────────────────────────────────
  # ICP MANAGER
  # ─────────────────────────────────────────
  /icp:
    get:
      operationId: listIcps
      tags: [icp]
      summary: List all ICPs
      responses:
        "200":
          description: List of ICPs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Icp"
    post:
      operationId: createIcp
      tags: [icp]
      summary: Create ICP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIcpBody"
      responses:
        "201":
          description: Created ICP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Icp"

  /icp/generate:
    post:
      operationId: generateIcpSuggestions
      tags: [icp]
      summary: Generate ICP suggestions using AI based on website and product description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateIcpBody"
      responses:
        "200":
          description: Array of generated ICP suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IcpSuggestion"

  /icp/{id}:
    get:
      operationId: getIcp
      tags: [icp]
      summary: Get ICP
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ICP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Icp"
        "404":
          description: Not found
    patch:
      operationId: updateIcp
      tags: [icp]
      summary: Update ICP
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIcpBody"
      responses:
        "200":
          description: Updated ICP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Icp"
        "404":
          description: Not found
    delete:
      operationId: deleteIcp
      tags: [icp]
      summary: Delete ICP
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ─────────────────────────────────────────
  # LEADS
  # ─────────────────────────────────────────
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads with filters and pagination
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: icpId
          in: query
          schema:
            type: ["integer", "null"]
        - name: industry
          in: query
          schema:
            type: ["string", "null"]
        - name: country
          in: query
          schema:
            type: ["string", "null"]
        - name: source
          in: query
          schema:
            type: ["string", "null"]
        - name: minScore
          in: query
          schema:
            type: ["integer", "null"]
        - name: maxScore
          in: query
          schema:
            type: ["integer", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Paginated list of leads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadListResponse"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a single lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadBody"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/import/csv:
    post:
      operationId: importLeadsCsv
      tags: [leads]
      summary: Bulk import leads from CSV data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportCsvBody"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /leads/import/paste:
    post:
      operationId: importLeadsPaste
      tags: [leads]
      summary: Bulk import leads from pasted text (AI-parsed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPasteBody"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /leads/bulk:
    patch:
      operationId: bulkUpdateLeads
      tags: [leads]
      summary: Bulk update lead status or sequence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateLeadsBody"
      responses:
        "200":
          description: Updated count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdateResult"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get single lead with full profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetail"
        "404":
          description: Not found
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadBody"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /leads/{id}/assign-sequence:
    post:
      operationId: assignLeadSequence
      tags: [leads]
      summary: Assign outreach sequence to lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignSequenceBody"
      responses:
        "200":
          description: Sequence assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  # ─────────────────────────────────────────
  # BRAND AUDIT ENGINE
  # ─────────────────────────────────────────
  /audit/categories:
    get:
      operationId: listAuditCategories
      tags: [audit]
      summary: List all audit signal categories with signals
      responses:
        "200":
          description: Audit categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditCategory"

  /audit/run:
    post:
      operationId: runAudit
      tags: [audit]
      summary: Run brand audit for a lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunAuditBody"
      responses:
        "200":
          description: Audit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditResult"

  /audit/runs/{runId}:
    get:
      operationId: getAuditRun
      tags: [audit]
      summary: Get full details for a single audit run
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full audit run data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRun"
        "404":
          description: Not found
    patch:
      operationId: updateAuditRun
      tags: [audit]
      summary: Update signal overrides on an audit run
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAuditBody"
      responses:
        "200":
          description: Updated audit run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRun"
        "404":
          description: Not found
    delete:
      operationId: deleteAuditRun
      tags: [audit]
      summary: Delete a single audit run by ID
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /audit/{leadId}:
    get:
      operationId: getAudit
      tags: [audit]
      summary: Get existing audit for a lead
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditResult"
        "404":
          description: Not found
    patch:
      operationId: updateAudit
      tags: [audit]
      summary: Update manual checklist items for a lead's audit
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAuditBody"
      responses:
        "200":
          description: Updated audit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditResult"

  /audit/{leadId}/history:
    get:
      operationId: getAuditHistory
      tags: [audit]
      summary: Get audit run history for a lead
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of audit runs (summary only, no signals)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditRunSummary"
    delete:
      operationId: clearAuditHistory
      tags: [audit]
      summary: Delete all audit runs for a lead
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: All audit runs deleted
        "400":
          description: Invalid lead ID

  /audit/generate-report:
    post:
      operationId: generateIntelReport
      tags: [audit]
      summary: Generate a client-facing Brand Intelligence PDF report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateIntelReportRequest"
      responses:
        "200":
          description: PDF binary stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Validation error
        "404":
          description: Lead not found

  /audit-bank:
    get:
      operationId: listAuditBank
      tags: [audit]
      summary: List all audit runs across all leads
      responses:
        "200":
          description: All audit runs with lead info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditBankEntry"

  # ─────────────────────────────────────────
  # OUTREACH AI ENGINE
  # ─────────────────────────────────────────
  /outreach-ai/emails:
    get:
      operationId: listOutreachEmails
      tags: [outreach-ai]
      summary: List all outreach emails
      responses:
        "200":
          description: All outreach emails with lead info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutreachEmailEntry"

  /outreach-ai/generate/{leadId}:
    post:
      operationId: generateOutreachEmail
      tags: [outreach-ai]
      summary: Generate AI outreach email for a lead (SSE)
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: SSE stream of generation progress

  /outreach-ai/generate-all:
    post:
      operationId: generateAllOutreachEmails
      tags: [outreach-ai]
      summary: Generate AI outreach emails for all leads (SSE)
      responses:
        "200":
          description: SSE stream of bulk generation progress

  /outreach-ai/emails/{id}:
    patch:
      operationId: updateOutreachEmail
      tags: [outreach-ai]
      summary: Update a draft outreach email
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOutreachEmailInput"
      responses:
        "200":
          description: Updated email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachEmailEntry"
    delete:
      operationId: deleteOutreachEmail
      tags: [outreach-ai]
      summary: Delete a draft outreach email
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /outreach-ai/audited-leads:
    get:
      operationId: listAuditedLeads
      tags: [outreach-ai]
      summary: List leads that have at least one brand audit report
      responses:
        "200":
          description: Audited leads with their audit summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditedLead"

  /outreach-ai/compose:
    post:
      operationId: composeOutreachEmail
      tags: [outreach-ai]
      summary: AI-generate an email for a specific lead using their audit report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeEmailInput"
      responses:
        "200":
          description: AI-generated subject and body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposedEmail"

  /outreach-ai/quick-send:
    post:
      operationId: quickSendEmail
      tags: [outreach-ai]
      summary: Create a draft and send it immediately (optionally with report attached)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickSendInput"
      responses:
        "200":
          description: Sent email record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachEmailEntry"

  /outreach-ai/emails/{id}/send:
    post:
      operationId: sendOutreachEmail
      tags: [outreach-ai]
      summary: Send an outreach email via SMTP
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sent or failed result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachEmailEntry"

  # ─────────────────────────────────────────
  # BANT QUALIFIER
  # ─────────────────────────────────────────
  /qualify/queue:
    get:
      operationId: getQualifyQueue
      tags: [qualify]
      summary: Get unscored leads queue
      responses:
        "200":
          description: Leads pending BANT scoring
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"

  /qualify/{leadId}/score:
    post:
      operationId: saveBantScore
      tags: [qualify]
      summary: Save BANT scores and trigger routing
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BantScoreBody"
      responses:
        "200":
          description: Updated lead with BANT score and routing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /qualify/{leadId}/ai:
    post:
      operationId: aiScoreLead
      tags: [qualify]
      summary: AI auto-score BANT for a lead
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI-suggested BANT scores with reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiBantScore"

  /qualify/{leadId}/explain:
    post:
      operationId: explainBantScores
      tags: [qualify]
      summary: Generate AI reasoning for existing BANT scores without changing them
      parameters:
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI reasoning for the existing BANT scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiBantScore"

  # ─────────────────────────────────────────
  # OUTREACH ENGINE
  # ─────────────────────────────────────────
  /outreach/sequences:
    get:
      operationId: listSequences
      tags: [outreach]
      summary: List outreach sequences
      responses:
        "200":
          description: List of sequences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutreachSequence"
    post:
      operationId: createSequence
      tags: [outreach]
      summary: Create outreach sequence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSequenceBody"
      responses:
        "201":
          description: Created sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachSequence"

  /outreach/sequences/{id}:
    patch:
      operationId: updateSequence
      tags: [outreach]
      summary: Update outreach sequence
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSequenceBody"
      responses:
        "200":
          description: Updated sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachSequence"

  /outreach/queue:
    get:
      operationId: getOutreachQueue
      tags: [outreach]
      summary: Get all pending touchpoints
      responses:
        "200":
          description: Pending touchpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Touchpoint"

  /outreach/generate:
    post:
      operationId: generateMessage
      tags: [outreach]
      summary: AI generate personalized outreach message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateMessageBody"
      responses:
        "200":
          description: Generated message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedMessage"

  /outreach/bulk-generate:
    post:
      operationId: bulkGenerateMessages
      tags: [outreach]
      summary: Bulk AI generate messages for queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkGenerateBody"
      responses:
        "200":
          description: Generated messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedMessage"

  /outreach/touchpoints/{id}:
    patch:
      operationId: updateTouchpoint
      tags: [outreach]
      summary: Update touchpoint status or content
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTouchpointBody"
      responses:
        "200":
          description: Updated touchpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Touchpoint"

  # ─────────────────────────────────────────
  # MEETING SYSTEM
  # ─────────────────────────────────────────
  /meetings:
    get:
      operationId: listMeetings
      tags: [meetings]
      summary: List all meetings
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of meetings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeetingWithLead"
    post:
      operationId: createMeeting
      tags: [meetings]
      summary: Create meeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingBody"
      responses:
        "201":
          description: Created meeting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meeting"

  /meetings/{id}:
    get:
      operationId: getMeeting
      tags: [meetings]
      summary: Get meeting detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Meeting detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingWithLead"
        "404":
          description: Not found
    patch:
      operationId: updateMeeting
      tags: [meetings]
      summary: Update meeting (notes, status)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeetingBody"
      responses:
        "200":
          description: Updated meeting
          content:
            application/json:
              schema:
