        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - firstName
        - lastName
        - email
        - company
        - designation
        - industry
        - country
        - source
        - status
        - keywords
        - tags
        - sequenceDay
        - createdAt
        - updatedAt

